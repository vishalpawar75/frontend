<header class="top-nav">
  <div class="brand">
    <div class="logo">
      <img src="/assets/vakratund-logo.png" alt="Vakratund Hybrid Seeds logo" />
    </div>
    <div>
      <div class="name">Vakratund Hybrid Seeds</div>
      <div class="tag">Farmer Producer Company</div>
    </div>
  </div>

  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/crops" routerLinkActive="active">Crop Info</a>
    <a routerLink="/analytics" routerLinkActive="active">Analytics</a>
    <a routerLink="/diagnose" routerLinkActive="active">Diagnose</a>
    <a *ngIf="auth.user?.role === 'admin'" routerLink="/admin" routerLinkActive="active">Admin</a>
    <a [routerLink]="['/']" fragment="inquiry">Partner with us</a>
  </nav>

  <div class="actions">
    <div class="user" *ngIf="auth.user">{{ auth.user.name }}</div>
    <a *ngIf="!auth.isAuthenticated()" class="btn ghost" routerLink="/login">Sign in</a>
    <button *ngIf="auth.isAuthenticated()" class="btn ghost" (click)="logout()">Sign out</button>
  </div>
</header>

<nav class="mobile-tabbar">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
  <a routerLink="/crops" routerLinkActive="active">Crops</a>
  <a routerLink="/diagnose" routerLinkActive="active">Diagnose</a>
  <a routerLink="/analytics" routerLinkActive="active">Analytics</a>
</nav>

<main>
  <router-outlet></router-outlet>
</main>

<footer class="footer">
  <div>
    <div class="footer-brand">
      <img src="/assets/vakratund-logo.png" alt="Vakratund Hybrid Seeds logo" />
      <strong>Vakratund Hybrid Seeds Private Limited</strong>
    </div>
    <p>Seed production partnerships across India.</p>
  </div>
  <div class="footer-meta">
    <span>Partner analytics available on request.</span>
  </div>
</footer>
